# =============================================================================
# Cities of the Frontier - optional iron economy
# =============================================================================
# This file owns the runtime differences between the classic gold-only economy
# and the optional iron economy. The player's choice is stored in
# iron_enabled and persists with the campaign save.
#
# Keep feature code dependent on the macros in this file rather than testing
# iron_enabled directly. This keeps both economy modes available without
# duplicating scenarios or project implementations.
# =============================================================================

# Conditions for use inside [if], [show_if], and similar tags.
# Treat an unset variable as enabled for compatibility with older saves.
#define IRON_ENABLED
	{VARIABLE_CONDITIONAL iron_enabled not_equals no}
#enddef

#define IRON_DISABLED
	{VARIABLE_CONDITIONAL iron_enabled equals no}
#enddef

# Use where the original behavior required the player to have explicitly
# selected iron mode, rather than merely loading a save without a mode value.
#define IRON_EXPLICITLY_ENABLED
	{VARIABLE_CONDITIONAL iron_enabled equals yes}
#enddef

# Checks to see whether a project may spend AMOUNT iron. Use inside an [if]
# block. Gold-only mode always satisfies the check.
#define CHECK_IRON AMOUNT
	[or]
		{IRON_DISABLED}
		[variable]
			name=playerIron
			greater_than_equal_to={AMOUNT}
		[/variable]
	[/or]
#enddef

#define PAY_IRON AMOUNT
	[if]
		{IRON_ENABLED}
		[then]
			{VARIABLE_OP playerIron sub {AMOUNT}}
			[if]
				{VARIABLE_CONDITIONAL playerIron less_than {IRON_WARNING_THRESHOLD}}
				[then]
					{FIRE_EVENT low_iron}
				[/then]
			[/if]
		[/then]
	[/if]
#enddef

#define GAIN_IRON AMOUNT
	[if]
		{IRON_ENABLED}
		[then]
			{VARIABLE_OP playerIron add {AMOUNT}}
			[if]
				{VARIABLE_CONDITIONAL playerIron greater_than_equal_to {IRON_WARNING_THRESHOLD}}
				[then]
					{CLEAR_VARIABLE warnings.low_iron}
				[/then]
			[/if]
		[/then]
	[/if]
#enddef

# Populate menu text once at the start of each scenario.
#define SET_PROJECT_COST_TEXT
	[if]
		{IRON_ENABLED}
		[then]
			[set_variables]
				name=project_cost_text
				mode=replace
				[value]
					armorer=_"{ARMORER_COST} gold, {ARMORER_IRON} iron"
					blacksmith=_"{FORGE_COST} gold, {FORGE_IRON} iron"
					bowyer=_"{BOWYER_COST} gold, {BOWYER_IRON} iron"
					library=_"{LIBRARY_COST} gold, {LIBRARY_IRON} iron"
					stables=_"{STABLE_COST} gold, {STABLE_IRON} iron"
					farm=_"{FARM_COST} gold, {FARM_IRON} iron"
					fort=_"{FORT_COST} gold, {FORT_IRON} iron"
				[/value]
			[/set_variables]
		[/then]
		[else]
			[set_variables]
				name=project_cost_text
				mode=replace
				[value]
					armorer=_"{ARMORER_COST} gold"
					blacksmith=_"{FORGE_COST} gold"
					bowyer=_"{BOWYER_COST} gold"
					library=_"{LIBRARY_COST} gold"
					stables=_"{STABLE_COST} gold"
					farm=_"{FARM_COST} gold"
					fort=_"{FORT_COST} gold"
				[/value]
			[/set_variables]
		[/else]
	[/if]
#enddef

# Award the seasonal output from every completed mine:
#   2 base iron
#   1 additional iron when staffed by a peasant
#   3 additional iron when staffed by a Dwarvish Miner
# Only one unit can occupy a mine, so the staffing bonuses are exclusive.
# GAIN_IRON makes this a no-op in gold-only mode.
#define PRODUCE_MINE_IRON
	[store_locations]
		variable=list_of_mines
		terrain=Qxu^Br|
	[/store_locations]

	[foreach]
		array=list_of_mines
		variable=this_mine
		[do]
			[if]
				[have_unit]
					x=$this_mine.x
					y=$this_mine.y
					type=CotF Dwarvish Miner
				[/have_unit]
				[then]
					{GAIN_IRON 3}
				[/then]
			[/if]
			[if]
				[have_unit]
					x=$this_mine.x
					y=$this_mine.y
					type=Peasant,Peasant Workers,Peasant_no_Advance,Peasant_to_Bowman,Peasant_to_Spearman
				[/have_unit]
				[then]
					{GAIN_IRON 1}
				[/then]
			[/if]
			{GAIN_IRON 2}
		[/do]
	[/foreach]
#enddef

# Install this once in each scenario. The event remains available after firing,
# while warnings.low_iron prevents repeats until GAIN_IRON re-arms it.
#define IRON_WARNINGS
	[event]
		name=low_iron
		first_time_only=no
		[filter_condition]
			{IRON_ENABLED}
			{VARIABLE_CONDITIONAL warnings.low_iron not_equals yes}
		[/filter_condition]
		{VARIABLE warnings.low_iron yes}
		{ADVISOR_SAYS _"Milord, our masons are running out of iron. May I suggest directing the Peasant Workers to build new mines or haul some slag from the hills?"}
		{TUTORIAL low_iron_warning _"Your iron reserves have fallen below {IRON_WARNING_THRESHOLD}. While this is common, particularly early in the game when you are building at a rapid pace, you should develop a strategy for getting more iron.
			Without iron, you will eventually become unable to build most new buildings. To get more iron, you will need to build a mine in the mountains or gather rubble from the hills. A mine will automatically produce
			2 iron for you at the start of each season, or 3 iron if you staff the mine with any type of peasant on the last turn of the season. Each time you send your peasant workers to flatten some hills,
			you will immediately gain 1 iron. Some say iron can also be had from the dwarves in the north, if you can find their home."}
	[/event]
#enddef
