# =============================================================================
# Cities of the Frontier - merfolk rescue
# =============================================================================

#define MERFOLK_RESCUE
	[event]
		name=die
		first_time_only=no
		[filter]
			type=Water Serpent
		[/filter]
		[filter_second]
			side=1
		[/filter_second]
		[filter_condition]
			[variable]
				name=merfolk_rescued
				not_equals=yes
			[/variable]
			[not]
				[have_unit]
					id=merman_leader
					search_recall_list=yes
				[/have_unit]
			[/not]
		[/filter_condition]

		{VARIABLE merfolk_rescued yes}

		[unit]
			side=1
			type=Mermaid Initiate
			x=$x1
			y=$y1
			canrecruit=no
			placement=map
			animate=yes
			role=merman_leader
			id=merman_leader
			[modifications]
				{TRAIT_LOYAL}
			[/modifications]
			{IS_LOYAL}
		[/unit]

		[repeat]
			times={DIFFICULTY_NUM 4 3 2}
			[do]
				[unit]
					side=1
					type=Merman Citizen
					x=$x1
					y=$y1
					canrecruit=no
					placement=map
					animate=yes
				[/unit]
			[/do]
		[/repeat]

		[message]
			speaker=merman_leader
			message=_"Thank you for rescuing us from the sea serpent! Now we can rebuild our homes."
		[/message]
		# Tutorials are off by default, so say how in character as well
		[message]
			speaker=merman_leader
			message=_"Lead my people to open water, marsh or ice, and each of them will raise a new home there under your banner."
		[/message]
		{TUTORIAL merfolk_village _"Move a Merman Citizen onto water, swamp or ice, then right-click it and choose 'Rebuild Merfolk Village'. The citizen settles there for good, turning the hex into a village that you own."}
		# Deeds done before the rescue still count towards the alliance
		[fire_event]
			name=merfolk_alliance_check
		[/fire_event]
	[/event]

	[event]
		name=prestart
		[set_menu_item]
			id=rebuild_homes
			description=_"Rebuild Merfolk Village"
			[show_if]
				[have_unit]
					type=Merman Citizen
					x=$x1
					y=$y1
				[/have_unit]
			[/show_if]
			[filter_location]
				terrain=W*,A*,S*
				x=$x1
				y=$y1
			[/filter_location]
			[command]
				[terrain]
					terrain="Wwt^Vm"
					x=$x1
					y=$y1
				[/terrain]
				[kill]
					x=$x1
					y=$y1
				[/kill]
				[capture_village]
					side=1
					x=$x1
					y=$y1
				[/capture_village]
			[/command]
		[/set_menu_item]
	[/event]
#enddef

#define SERPENT_KILLS_FOR_MERFOLK_RECRUITS
5#enddef

#define MERFOLK_ALLIANCE
	# Once rescued, the merfolk offer recruits when the player has killed
	# enough sea serpents, or the saurian leader has fallen to the player or
	# an ally (often the elves). Deeds count in every season and before the
	# rescue, so include this in every seasonal scenario.
	[event]
		name=die
		first_time_only=no
		[filter]
			type=Water Serpent
		[/filter]
		[filter_second]
			side=1
		[/filter_second]
		{VARIABLE_OP merfolk_serpents_killed add 1}
		[fire_event]
			name=merfolk_alliance_check
		[/fire_event]
	[/event]

	[event]
		name=die
		first_time_only=no
		[filter]
			role=saurian_leader
		[/filter]
		[filter_second]
			side=1
			[or]
				[filter_side]
					[allied_with]
						side=1
					[/allied_with]
				[/filter_side]
			[/or]
		[/filter_second]
		{VARIABLE merfolk_saurians_defeated yes}
		[fire_event]
			name=merfolk_alliance_check
		[/fire_event]
	[/event]

	[event]
		name=merfolk_alliance_check
		first_time_only=no
		[filter_condition]
			{VARIABLE_CONDITIONAL merfolk_rescued equals yes}
			{VARIABLE_CONDITIONAL merfolk_recruits not_equals yes}
			[and]
				{VARIABLE_CONDITIONAL merfolk_serpents_killed greater_than_equal_to {SERPENT_KILLS_FOR_MERFOLK_RECRUITS}}
				[or]
					{VARIABLE_CONDITIONAL merfolk_saurians_defeated equals yes}
				[/or]
			[/and]
		[/filter_condition]
		{VARIABLE merfolk_recruits yes}
		{ALLOW_RECRUIT (Merman Fighter,Merman Hunter)}
		[if]
			[have_unit]
				id=merman_leader
			[/have_unit]
			[then]
				[if]
					{VARIABLE_CONDITIONAL merfolk_saurians_defeated equals yes}
					[then]
						[message]
							speaker=merman_leader
							message=_"The saurians who hunted our waters are broken at last. Our young warriors are yours to call upon, friend."
						[/message]
					[/then]
					[else]
						[message]
							speaker=merman_leader
							message=_"So many serpents slain! The seas are safe again, and our young warriors would be proud to fight beside you."
						[/message]
					[/else]
				[/if]
			[/then]
			[else]
				{NARRATOR_SAYS _"Word of your deeds has spread beneath the waves. Merfolk warriors now offer to join your service."}
			[/else]
		[/if]
		{TUTORIAL merfolk_recruits _"You can now recruit Merman Fighters and Merman Hunters. They fight best in water, so they are well suited to guarding coasts, rivers and lakes."}
	[/event]
#enddef
