# =============================================================================
# Cities of the Frontier - merfolk rescue
# =============================================================================

#define MERFOLK_RESCUE
	[event]
		name=die
		first_time_only=no
		[filter]
			type=Water Serpent
		[/filter]
		[filter_second]
			side=1
		[/filter_second]
		[filter_condition]
			[variable]
				name=merfolk_rescued
				not_equals=yes
			[/variable]
			[not]
				[have_unit]
					id=merman_leader
					search_recall_list=yes
				[/have_unit]
			[/not]
		[/filter_condition]

		{VARIABLE merfolk_rescued yes}

		[unit]
			side=1
			type=Mermaid Initiate
			x=$x1
			y=$y1
			canrecruit=no
			placement=map
			animate=yes
			role=merman_leader
			id=merman_leader
			[modifications]
				{TRAIT_LOYAL}
			[/modifications]
			{IS_LOYAL}
		[/unit]

		[repeat]
			times={DIFFICULTY_NUM 4 3 2}
			[do]
				[unit]
					side=1
					type=Merman Citizen
					x=$x1
					y=$y1
					canrecruit=no
					placement=map
					animate=yes
				[/unit]
			[/do]
		[/repeat]

		[message]
			speaker=merman_leader
			message=_"Thank you for rescuing us from the sea serpent! Now we can rebuild our homes."
		[/message]
		# Tutorials are off by default, so say how in character as well
		[message]
			speaker=merman_leader
			message=_"Lead my people to open water, marsh or ice, and each of them will raise a new home there under your banner."
		[/message]
		{TUTORIAL merfolk_village _"Move a Merman Citizen onto water, swamp or ice, then right-click it and choose 'Rebuild Merfolk Village'. The citizen settles there for good, turning the hex into a village that you own."}
	[/event]

	[event]
		name=prestart
		[set_menu_item]
			id=rebuild_homes
			description=_"Rebuild Merfolk Village"
			[show_if]
				[have_unit]
					type=Merman Citizen
					x=$x1
					y=$y1
				[/have_unit]
			[/show_if]
			[filter_location]
				terrain=W*,A*,S*
				x=$x1
				y=$y1
			[/filter_location]
			[command]
				[terrain]
					terrain="Wwt^Vm"
					x=$x1
					y=$y1
				[/terrain]
				[kill]
					x=$x1
					y=$y1
				[/kill]
				[capture_village]
					side=1
					x=$x1
					y=$y1
				[/capture_village]
			[/command]
		[/set_menu_item]
	[/event]
#enddef
